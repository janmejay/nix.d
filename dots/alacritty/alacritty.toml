# Mirrors dots/dot_config/wezterm/wezterm.lua. Wezterm takes preference where
# the two diverge; pastel-dark palette carried over from the prior ghostty
# config since wezterm doesn't pin one.

[window]
decorations = "Buttonless"
dynamic_title = true
padding = { x = 0, y = 0 }
opacity = 1.0

[font]
size = 13.0

# Widen the cell horizontally so characters don't sit on top of each other.
# Positive `x` adds N pixels of space to each cell; y unchanged.
[font.offset]
x = 1
y = 0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Thin"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "SemiBold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Thin Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "SemiBold Italic"

[bell]
animation = "EaseOutExpo"
duration = 0

# Wezterm default palette (wezterm-term/src/color.rs default scheme).
[colors.primary]
background = "#000000"
foreground = "#b3b3b3"

[colors.cursor]
text = "#000000"
cursor = "#b3b3b3"

[colors.selection]
text = "#000000"
background = "#b3b3b3"

[colors.normal]
black   = "#000000"
red     = "#cc5555"
green   = "#55cc55"
yellow  = "#cdcd00"
blue    = "#5555cc"
magenta = "#cc55cc"
cyan    = "#7acaca"
white   = "#cccccc"

[colors.bright]
black   = "#555555"
red     = "#ff5555"
green   = "#55ff55"
yellow  = "#ffff55"
blue    = "#5555ff"
magenta = "#ff55ff"
cyan    = "#55ffff"
white   = "#ffffff"

# Paste / Copy + font size — wezterm defaults on macOS.
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "="
mods = "Control|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "+"
mods = "Control|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "-"
mods = "Control|Shift"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "_"
mods = "Control|Shift"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "0"
mods = "Control|Shift"
action = "ResetFontSize"

[[keyboard.bindings]]
key = ")"
mods = "Control|Shift"
action = "ResetFontSize"

# Cmd+w family: swallow so accidental presses don't close the window.
[[keyboard.bindings]]
key = "W"
mods = "Command"
action = "ReceiveChar"
[[keyboard.bindings]]
key = "W"
mods = "Command|Shift"
action = "ReceiveChar"
[[keyboard.bindings]]
key = "W"
mods = "Command|Alt"
action = "ReceiveChar"

# Cmd+<char> => ESC+<char> so Cmd acts as Meta. Excludes q, w, n (matches
# the all_characters string in wezterm.lua).
[[keyboard.bindings]]
key = "`"
mods = "Command"
chars = "\u001b`"
